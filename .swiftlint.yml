# Mozi SwiftLint
# 기준: 안전성 우선 + SwiftUI/TCA/DesignSystem 실무 균형
# strict CI를 유지하되, 스타일 노이즈는 완화

disabled_rules:
  # 포맷/스타일 노이즈
  - trailing_whitespace
  - todo
  - multiple_closures_with_trailing_closure
  - trailing_comma
  - file_length
  - opening_brace
  - statement_position
  - sorted_imports
  - nesting

opt_in_rules:
  # 안전성
  - force_unwrapping
  - implicitly_unwrapped_optional
  - unowned_variable_capture
  - weak_delegate
  # 실용 품질
  - private_over_fileprivate
  - empty_enum_arguments
  - first_where
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - overridden_super_call
  - toggle_bool
  - modifier_order
  - redundant_nil_coalescing

# 안전성
force_unwrapping: error
implicitly_unwrapped_optional: error
force_cast: warning
force_try: warning

# 가독성: 너무 타이트하지 않게 완화
line_length:
  warning: 120
  error: 140
  ignores_comments: true
  ignores_urls: true

function_body_length:
  # --strict promotes warnings to errors, so warning is the practical gate
  warning: 90
  error: 120

type_body_length:
  warning: 250
  error: 350

# 테스트 코드의 짧은 타입명(OK 등) 허용을 위해 최소 길이 완화
type_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60

# 디자인 토큰 shade 이름(_50, _300)과 짧은 식별자 허용
identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 50
    error: 60
  allowed_symbols: "_"
  excluded:
    - id
    - x
    - y
    - z
    - i
    - j
    - on
    - to
    - at
    - vc
    - _0
    - _50
    - _100
    - _200
    - _300
    - _400
    - _500
    - _600
    - _700
    - _800
    - _900
    - _1000

cyclomatic_complexity:
  warning: 12
  error: 20

# 프로젝트 생성물/외부 영역 제외
excluded:
  - Tuist
  - .build
  - Derived
  - DerivedData
  - .derivedData
  - .derivedData-app
  - .derivedData-app2
  - .derivedData-coresocialauth
  - .derivedData-data
  - .derivedData-data2
  - .derivedData-feature
  - .derivedData-feature2
  - .derivedData-feature3
  - .derivedData-networklog
  - .derivedData-rename
  - .derivedData-rename-app
  - .git
  - Mozi.xcworkspace
  - "**/*.xcodeproj"
