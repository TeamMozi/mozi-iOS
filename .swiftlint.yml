# Mozi SwiftLint draft
# 기준: StyleShare 계열 가이드 + 현재 레포(SwiftUI/TCA)
# 상태: 초안. 세부 룰은 추후 조정 가능

disabled_rules:
  # 초안 단계 노이즈 완화
  - trailing_whitespace
  - todo
  - multiple_closures_with_trailing_closure
  - trailing_comma
  - file_length
  # 포맷터 없이 과도한 스타일 강제 완화
  - opening_brace
  - statement_position

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - closure_spacing
  - unowned_variable_capture
  - private_over_fileprivate
  - empty_enum_arguments
  - weak_delegate
  - first_where
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - overridden_super_call
  - toggle_bool
  - closure_body_length
  - sorted_imports
  - vertical_whitespace_closing_braces
  - modifier_order
  - redundant_nil_coalescing
  - unused_import

# 안전성
force_unwrapping: error
implicitly_unwrapped_optional: error
force_cast: warning
force_try: warning

# 한 줄 길이: 초안 단계 노이즈 완화를 위해 상향
line_length:
  warning: 120
  error: 140
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 250
  error: 350

file_length:
  warning: 400
  error: 600

# 테스트 코드의 짧은 타입명(OK 등) 허용을 위해 최소 길이 완화
type_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60

# 테스트 코드의 짧은 식별자(a/b/c 등) 허용을 위해 최소 길이 완화
identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - z
    - i
    - j
    - on
    - to
    - at
    - vc

nesting:
  type_level:
    warning: 2
    error: 3

cyclomatic_complexity:
  warning: 12
  error: 20

# 프로젝트 생성물/외부 영역 제외
excluded:
  - Tuist
  - .build
  - Derived
  - DerivedData
  - .derivedData
  - .git
  - Mozi.xcworkspace
  - "**/*.xcodeproj"
