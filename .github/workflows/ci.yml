name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: SwiftLint
        run: mise exec -- swiftlint lint --strict

  build_and_test:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Prepare local config
        run: |
          cp Config/Example.xcconfig Config/Debug.xcconfig
          cp Config/Example.xcconfig Config/Release.xcconfig

      - name: Generate project
        run: mise exec -- tuist generate --no-open

      - name: Build
        run: |
          xcodebuild \
            -workspace Mozi.xcworkspace \
            -scheme Mozi-Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            build

      - name: Test Feature Reducers
        run: |
          DESTINATION="$(
            python3 -c '
          import re
          import subprocess

          output = subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available"],
              text=True,
          )
          for line in output.splitlines():
              match = re.search(r"iPhone.+?\(([A-F0-9-]{36})\)", line)
              if match:
                  print(f"platform=iOS Simulator,id={match.group(1)}")
                  break
          else:
              raise SystemExit("No available iPhone simulator found")
          '
          )"
          echo "Using destination: $DESTINATION"
          xcodebuild \
            -workspace Mozi.xcworkspace \
            -scheme Feature \
            -destination "$DESTINATION" \
            -skipMacroValidation \
            test
