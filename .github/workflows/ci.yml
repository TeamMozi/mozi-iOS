name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

env:
  # 없으면 mise exec 가 .mise.toml 의 빠진 도구(Ruby)까지 설치한다.
  MISE_EXEC_AUTO_INSTALL: "false"
  # 로컬과 같은 Xcode 를 쓴다. 올릴 때는 docs/agent/knowledge/operations.md 의 절차대로
  # 이 값과 DESTINATION 의 OS 를 함께 올린다. 캐시 이름도 이 값을 따라 바뀐다.
  XCODE_VERSION: "26.4.1"
  # 로컬 규칙(docs/agent/rules/verify.md)과 같은 지정값이다. 런타임 표시 이름은 iOS 26.4 지만 OS 는 26.4.1 로 써야 찾는다.
  DESTINATION: "platform=iOS Simulator,name=iPhone 17e,OS=26.4.1"
  # Boot simulator 단계가 DESTINATION 과 같은 기기를 찾는 데 쓴다. Xcode 를 올릴 때 함께 올린다.
  SIMULATOR_NAME: "iPhone 17e"
  SIMULATOR_RUNTIME: "com.apple.CoreSimulator.SimRuntime.iOS-26-4"

# 겹치는 PR 실행은 취소하고, main/dev push 실행은 남긴다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 프로젝트를 생성하지 않는다. 그래서 DerivedData 캐시도 쓰지 않는다.
  lint:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: true
          # CI 는 fastlane 을 쓰지 않는다. Ruby 설치를 건너뛴다.
          install_args: "tuist swiftlint"
          cache: true

      - name: SwiftLint
        run: mise exec -- swiftlint lint --strict

  # Mozi-Workspace 스킴은 본 앱·데모 앱·모듈을 모두 Debug 로 빌드하고 테스트 타깃 8개를 돌린다.
  # 그래서 앱 빌드 잡을 따로 두지 않는다.
  test:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Tuist.swift 가 읽는다. 매니페스트에는 셸 환경 변수가 전달되지 않아 TUIST_ 접두어를 쓴다.
      TUIST_CI_WORKSPACE: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: true
          # CI 는 fastlane 을 쓰지 않는다. Ruby 설치를 건너뛴다.
          install_args: "tuist swiftlint"
          cache: true

      - name: Prepare local config
        run: |
          cp Config/Example.xcconfig Config/Debug.xcconfig
          cp Config/Example.xcconfig Config/Release.xcconfig

      # 생성보다 먼저 복원한다. 저장은 아래 Save 단계가 dev push 에서만 한다.
      - name: Restore derived data
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: .derivedData
          key: dd-test-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('.package.resolved', 'Projects/**/Project.swift') }}-${{ github.sha }}
          restore-keys: |
            dd-test-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('.package.resolved', 'Projects/**/Project.swift') }}-
            dd-test-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      # 복원한 캐시의 패키지 해시가 지금과 같을 때만 패키지 원격 갱신을 건너뛴다. 다르면 낡은 패키지로 빌드하게 된다.
      - name: Check package cache
        if: startsWith(steps.restore.outputs.cache-matched-key, format('dd-test-{0}-xcode{1}-{2}-', runner.os, env.XCODE_VERSION, hashFiles('.package.resolved', 'Projects/**/Project.swift')))
        run: echo "TUIST_CI_SKIP_PACKAGE_UPDATES=true" >> "$GITHUB_ENV"

      - name: Generate project
        run: mise exec -- tuist generate --no-open

      # 새 기기의 첫 부팅(45~87초)을 빌드와 겹치게 한다. 준비 완료는 Test 직전에 기다린다.
      # 잡 시작 때 부팅하면 mise 설치·캐시 복원까지 느려져서(2026-10-02 실측) 생성 뒤에 시작한다.
      # 지정한 런타임에 그 기기가 없으면 여기서 실패한다.
      - name: Boot simulator
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"].get(os.environ["SIMULATOR_RUNTIME"], [])
          print(next(d["udid"] for d in devices if d["name"] == os.environ["SIMULATOR_NAME"]))
          ')"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"

      - name: Build for testing
        run: |
          xcodebuild \
            -workspace Mozi.xcworkspace \
            -scheme Mozi-Workspace \
            -destination "$DESTINATION" \
            -derivedDataPath .derivedData \
            -skipMacroValidation \
            build-for-testing

      - name: Wait for simulator
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Test
        run: |
          xcodebuild \
            -workspace Mozi.xcworkspace \
            -scheme Mozi-Workspace \
            -destination "$DESTINATION" \
            -derivedDataPath .derivedData \
            -skipMacroValidation \
            test-without-building

      # path 에 폴더 이름만 적으면 actions/cache 가 그 아래 파일을 후보로 올리지 않아
      # `!` 제외 줄이 뺄 대상을 못 찾는다 (actions/toolkit#713). 그래서 저장 전에 지운다.
      # 둘 다 다시 만들어지는 폴더다.
      - name: Trim derived data before caching
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: rm -rf .derivedData/Logs .derivedData/Index.noindex

      - name: Save derived data
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/cache/save@v6
        with:
          path: .derivedData
          key: dd-test-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('.package.resolved', 'Projects/**/Project.swift') }}-${{ github.sha }}
