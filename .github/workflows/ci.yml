name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# 겹치는 PR 실행은 취소하고, main/dev push 실행은 남긴다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: SwiftLint
        run: mise exec -- swiftlint lint --strict

  build_and_test:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Prepare local config
        run: |
          cp Config/Example.xcconfig Config/Debug.xcconfig
          cp Config/Example.xcconfig Config/Release.xcconfig

      - name: Generate project
        run: mise exec -- tuist generate --no-open

      - name: Select simulator
        run: |
          DESTINATION="$(
            python3 -c '
          import re
          import subprocess

          output = subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available"],
              text=True,
          )
          for line in output.splitlines():
              match = re.search(r"iPhone.+?\(([A-F0-9-]{36})\)", line)
              if match:
                  print(f"platform=iOS Simulator,id={match.group(1)}")
                  break
          else:
              raise SystemExit("No available iPhone simulator found")
          '
          )"
          echo "Using destination: $DESTINATION"
          echo "DESTINATION=$DESTINATION" >> "$GITHUB_ENV"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .derivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('.package.resolved', 'Projects/**/Project.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build
        run: |
          xcodebuild \
            -workspace Mozi.xcworkspace \
            -scheme Mozi-Debug \
            -destination "$DESTINATION" \
            -derivedDataPath .derivedData \
            -skipMacroValidation \
            build

      - name: Test Feature Reducers
        run: |
          xcodebuild \
            -workspace Mozi.xcworkspace \
            -scheme Feature \
            -destination "$DESTINATION" \
            -derivedDataPath .derivedData \
            -skipMacroValidation \
            test
